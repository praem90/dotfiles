
[bell]
animation = "EaseOutExpo"

[bell.command]
args = ["-e", "beep"]
program = "osascript"

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.glyph_offset]
x = 0
y = 8

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 16

[colors]
draw_bold_text_with_bright_colors = true
transparent_background_colors = true

[terminal]

[terminal.shell]
program = "/bin/zsh"

[window]
opacity = 0.9
blur = true
startup_mode = "Maximized"

[general]
import = ["./tokyo-night.toml"]
